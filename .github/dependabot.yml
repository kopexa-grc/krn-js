version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    ignore:
      # Major versions are updated by hand, one topic at a time.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Biome is updated together with sight, the frontend and the backend.
      - dependency-name: "@biomejs/biome"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns: ["*"]
